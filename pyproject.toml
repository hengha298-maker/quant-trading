[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-paper"
version = "0.1.0"
description = "Windows A股纯模拟交易"
requires-python = ">=3.12"
dependencies = ["akshare>=1.18,<2", "exchange-calendars>=4.11,<5", "tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
quant-paper = "quant_paper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
