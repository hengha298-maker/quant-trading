name: V3.2 isolated research
on:
  push:
    paths: ['v32/**', 'v3/**', '*V3.2*.cmd', 'Replay-600900-2025.cmd', '.github/workflows/v32.yml']
  pull_request:
    paths: ['v32/**', 'v3/**', '*V3.2*.cmd', 'Replay-600900-2025.cmd', '.github/workflows/v32.yml']
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r v32/requirements-lock.txt
      - run: python -B -m unittest discover -s v32/tests -v
      - run: python -B -m unittest discover -s v3/tests -p test_server.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test v3/tests/*.test.mjs
