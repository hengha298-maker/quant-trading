name: V3 offline wealth MVP
on:
  push:
    paths: ['v3/**', 'Start-V3.cmd', '.github/workflows/v3.yml']
  pull_request:
    paths: ['v3/**', 'Start-V3.cmd', '.github/workflows/v3.yml']
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test v3/tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s v3/tests -p test_server.py -v
