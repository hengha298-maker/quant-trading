name: Investment assistant
on:
  pull_request:
    paths: ['investment/**', 'AUTOMATION.md', '.github/workflows/investment.yml']
  push:
    paths: ['investment/**', 'AUTOMATION.md', '.github/workflows/investment.yml']
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: '1'
      GOOSE_RESEARCH_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r v32/requirements-lock.txt
      - run: python -B -m unittest discover -s investment/tests -q
      - run: node --test investment/tests/*.test.mjs
