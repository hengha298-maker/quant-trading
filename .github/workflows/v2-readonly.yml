name: V2 readonly P1 integration
on: [push, pull_request]
jobs:
  readonly:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hengha298-maker/quant-trading
          ref: f6c117fab964f2e627d1a64a651bab2827ff0308
          path: _p1_dependency
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin and execute actual P1 validators
        env:
          GOOSE_P1_CODE: ${{ github.workspace }}/_p1_dependency
        run: python -m unittest discover -s v2/tests -p test_readonly.py -v
      - name: Original demo model
        run: node v2/tests/model.test.cjs
      - name: Phone transport boundary and foreground lifecycle (fictional CLI and peers)
        env:
          GOOSE_P1_CODE: ${{ github.workspace }}/_p1_dependency
        run: python -m unittest discover -s v2/tests -p test_phone.py -v
      - name: Explicit private JSON adapter and authenticated lifecycle (temporary fictional files only)
        env:
          GOOSE_P1_CODE: ${{ github.workspace }}/_p1_dependency
        run: python -m unittest discover -s v2/tests -p test_private.py -v
      # Keep monitoring tests in both native environments; no real CLI login.
      # The 1.104.2 fixtures contain no user status or private configuration.
      - name: Tailscale 1.104.2 monitor diagnostics and Windows retry
        env:
          GOOSE_P1_CODE: ${{ github.workspace }}/_p1_dependency
        run: python -m unittest discover -s v2/tests -p test_transport_monitor.py -v
      - name: Versioned whois 1.104.2 expiry serialization contract
        run: python -m unittest discover -s v2/tests -p test_whois_1042.py -v
      - name: Private self HTTPS checks and bounded fixed-code observations
        run: python -m unittest discover -s v2/tests -p test_connection_diagnostics.py -v
      - name: Actual HTTP request observation and device guards
        env:
          GOOSE_P1_CODE: ${{ github.workspace }}/_p1_dependency
        run: python -m unittest discover -s v2/tests -p test_request_diagnostics.py -v
      - name: Windows diagnostic controls preserve selections and stopping
        run: python -m unittest discover -s v2/tests -p test_connection_controls.py -v
      - name: Official Go encoded identity structures (synthetic, not live)
        run: python -m unittest discover -s v2/tests -p test_official_identity_schema.py -v
      - name: Strict identity field diagnostics
        run: python -m unittest discover -s v2/tests -p test_identity_diagnostics.py -v
      - name: Legacy peer authorization requires fresh admitted key and trusted Serve
        run: python -m unittest discover -s v2/tests -p test_peer_authorization.py -v
      - name: Identity startup preflight before selected files
        run: python -m unittest discover -s v2/tests -p test_identity_preflight.py -v
      - name: Share history remains separate from current observation window
        run: python -m unittest discover -s v2/tests -p test_identity_trace_history.py -v
      - name: Native owner sees all identity blockers without another phone test
        run: python -m unittest discover -s v2/tests -p test_identity_owner_controls.py -v
      - name: Diagnostic runtime protocol rejects mixed components
        run: python -m unittest discover -s v2/tests -p test_runtime_diagnostic_protocol.py -v
      - name: Build marker and fresh clipboard for empty or pending diagnostics
        run: python -m unittest discover -s v2/tests -p test_diagnostic_copy.py -v
      - name: Original demo cache
        run: node v2/tests/sw.test.cjs
      - name: Readonly contract and mode isolation
        run: node v2/tests/readonly-model.test.cjs
      - name: Original preview remains demonstration only
        run: python -m unittest discover -s v2/tests -p test_preview.py -v
